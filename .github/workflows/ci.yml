name: Production Multi-Stage CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ===============================================================
  # STAGE 1: Code Quality & Syntax Validation
  # ===============================================================
  stage-1-code-quality:
    name: "Stage 1: Code Quality & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Validate Dependencies
        run: npm ci

      - name: Syntax & Code Check
        run: node -c server.js

  # ===============================================================
  # STAGE 2: DevSecOps Security Scan (Secrets & Dockerfile Check)
  # ===============================================================
  stage-2-security-scan:
    name: "Stage 2: Security & Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Secret Leak Detection
        run: |
          echo "Scanning repository for leaked credentials..."
          if grep -rn "password" . --exclude-dir={node_modules,.git} --exclude={.env.example,docker-compose.yml}; then
            echo "Warning: verify no plaintext secrets are committed."
          else
            echo "Secret check passed cleanly."
          fi

      - name: Validate Dockerfile Syntax
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile || true

  # ===============================================================
  # STAGE 3: Multi-Stage Build & Push to Docker Hub
  # ===============================================================
  stage-3-build-and-push:
    name: "Stage 3: Build & Push Image"
    needs: [stage-1-code-quality, stage-2-security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/production-docker-microservice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===============================================================
  # STAGE 4: Automated Image Verification & Smoke Test
  # ===============================================================
  stage-4-verify-deployment:
    name: "Stage 4: Verify Image & Healthcheck"
    needs: [stage-3-build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Published Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/production-docker-microservice:latest

      - name: Test Non-Root User Compliance
        run: |
          USER_NAME=$(docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/production-docker-microservice:latest whoami)
          echo "Container is running as: $USER_NAME"
          if [ "$USER_NAME" = "root" ]; then
            echo "ERROR: Container is running as root! Security policy violation."
            exit 1
          fi
          echo "Security validation passed: Non-root user verified."
